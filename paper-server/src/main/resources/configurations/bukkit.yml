# This is the Bukkit configuration file in Gina-Hub, a heavily modified fork of Paper.
# As you can see, there's actually not that much to configure without any plugins.
#
# This config format is inherited unchanged from Paper. For general Bukkit/Paper
# configuration questions, the upstream Paper documentation still applies:
#
# File Reference: https://docs.papermc.io/paper/reference/bukkit-configuration/
# Paper Docs: https://docs.papermc.io/
# Paper Discord: https://discord.gg/papermc
# Paper Website: https://papermc.io/

settings:
    allow-end: false
    warn-on-overload: true
    permissions-file: configs/permissions.yml
    world-container: worlds
    update-folder: update
    plugin-profiling: false
    connection-throttle: 4000
    query-plugins: true
    deprecated-verbose: default
    shutdown-message: Server closed
    minimum-api: none
    use-map-color-cache: true
spawn-limits:
    monsters: 70
    animals: 10
    water-animals: 5
    water-ambient: 20
    water-underground-creature: 5
    axolotls: 5
    ambient: 15
chunk-gc:
    period-in-ticks: 600
ticks-per:
    animal-spawns: 400
    monster-spawns: 1
    water-spawns: 1
    water-ambient-spawns: 1
    water-underground-creature-spawns: 1
    axolotl-spawns: 1
    ambient-spawns: 1
    autosave: 6000
aliases: now-in-commands.yml
